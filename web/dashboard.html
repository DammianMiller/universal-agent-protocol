<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAP Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>"
    />
    <link rel="stylesheet" href="/vendor/uPlot.min.css" />
    <link rel="stylesheet" href="/dash/styles.css" />
    <script src="/vendor/uPlot.iife.min.js"></script>
  </head>
  <body>
    <div class="toast-container" id="toast-container"></div>
    <div class="container">
      <header>
        <h1>UAP Dashboard</h1>
        <div class="header-center">
          <span class="sys-badge"><span class="label">v</span><span class="val" id="sys-version">?</span></span>
          <span class="sys-badge"><span class="label">branch </span><span class="val cyan" id="sys-branch">?</span></span>
          <span class="sys-badge"><span class="label">dirty </span><span class="val" id="sys-dirty">?</span></span>
        </div>
        <div class="header-right">
          <span class="header-ts" id="data-ts"></span>
          <div>
            <span class="status-dot disconnected" id="ws-status" role="status" aria-label="Connection status: disconnected"></span>
            <span class="refresh-info" id="refresh-info">Connecting…</span>
          </div>
        </div>
      </header>

      <nav class="tabbar" id="tabbar" role="tablist"></nav>

      <main id="view"></main>
    </div>

    <script>
      // Server injects these at serve time (same-origin only). The token gates
      // every mutation; the refresh cadence matches `uap dash serve --refresh`.
      window.__UAP_BOOT = {
        token: '__UAP_DASHBOARD_TOKEN__'.indexOf('__UAP') === 0 ? '' : '__UAP_DASHBOARD_TOKEN__',
        refreshMs: Number('__UAP_DASH_REFRESH_MS__') > 0 ? Number('__UAP_DASH_REFRESH_MS__') : 2000,
      };
    </script>
    <script src="/dash/charts.js"></script>
    <script src="/dash/core.js"></script>
    <script src="/dash/tabs.js"></script>
  </body>
</html>
