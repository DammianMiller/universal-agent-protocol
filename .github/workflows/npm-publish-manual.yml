name: NPM Publish - Manual Trigger

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.7.0)'
        required: true
        default: '1.7.0'
      force:
        description: 'Force publish even if version exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # Node 24: npm OIDC trusted publishing needs Node >= 22.14.0 AND
  # npm >= 11.5.1. Node 20 fails the exchange with a misleading ENEEDAUTH.
  NODE_VERSION: '24'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Set version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "Updating package.json version from $CURRENT_VERSION to ${{ github.event.inputs.version }}"
            npm version ${{ github.event.inputs.version }} --no-git-tag-version || true
          else
            echo "Version already at $CURRENT_VERSION, skipping version bump"
          fi

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Trusted publishing (OIDC): the package has a GitHub Actions trusted
      # publisher configured for this workflow, so no token is involved at all
      # (and no 2FA OTP — token-based auth hit E404 from setup-node's
      # $NPM_CONFIG_USERCONFIG shadowing ~/.npmrc, then EOTP with a 2FA
      # account). OIDC auth needs npm CLI >= 11.5.1; Node 20 bundles npm 10,
      # so upgrade npm before publishing. Do NOT set NODE_AUTH_TOKEN here —
      # a present-but-2FA-bound token would be tried first and fail the run.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          # npm 12+ needs node >=22; npm 11.x supports node 20.17+ and has
          # OIDC trusted publishing since 11.5.1.
          npm install -g npm@^11.5.1
          npm --version
          # Drop the empty ${NODE_AUTH_TOKEN} reference setup-node left in its
          # job-wide npmrc — an empty bearer token would fail before the OIDC
          # exchange is attempted.
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPMRC"

      - name: Publish to NPM
        run: |
          echo "Publishing with force=${{ github.event.inputs.force }}"
          # OIDC env sanity (values are secrets — presence/absence only).
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo NO)"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npm publish --access public --provenance --ignore-scripts --force
          else
            npm publish --access public --provenance --ignore-scripts
          fi

      # On failure, ENEEDAUTH is ambiguous: it appears both when npm never
      # attempts the OIDC exchange and when the registry rejects it. The npm
      # debug log records which. Dump the auth/oidc-relevant lines so the
      # next fix targets the right layer (client config vs npm-side trusted
      # publisher entry).
      - name: Dump npm debug log on failure
        if: failure()
        run: |
          LOG=$(ls -t "$HOME/.npm/_logs/"*-debug-0.log 2>/dev/null | head -1)
          echo "npm debug log: $LOG"
          if [ -n "$LOG" ]; then
            grep -iE "oidc|token|auth|provenance|registry|publish" "$LOG" \
              | grep -viE "tarball|integrity|shasum" | tail -40
          fi
