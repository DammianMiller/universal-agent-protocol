name: Build, Test & Publish to NPM

on:
  push:
    branches: [main, master]
    tags-ignore: ['**'] # Ignore tag pushes (handled by release job)

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish to npm registry'
        required: false
        default: true
        type: boolean

env:
  # Node 24: npm OIDC trusted publishing needs Node >= 22.14.0 AND
  # npm >= 11.5.1. Node 20 bundles npm 10, which fails the OIDC exchange.
  NODE_VERSION: '24'

# Workflow-level (not job-level) so the OIDC id-token grant matches the
# shape proven working in npm-publish-manual.yml (which published 2.16.2).
# create-release overrides this with its own job-level permissions block.
permissions:
  contents: read
  # OIDC trusted publishing: npm exchanges a GitHub Actions identity
  # token for publish auth — no NPM_TOKEN, no 2FA OTP. The token path
  # failed EOTP on every release since 2.12 (npm's own deprecation
  # notice in the logs confirms token-based publishing is being
  # restricted; OIDC is the replacement).
  id-token: write

jobs:
  build-test-npm-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Validate droid integrity
        run: node dist/bin/cli.js droids validate

      - name: Run tests
        run: npm test

      - name: Get package version
        id: get_version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Check if version exists on NPM
        id: check_npm
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          EXISTING_VERSION=$(npm view @miller-tech/uap@$VERSION version 2>/dev/null || echo "")
          if [ -n "$EXISTING_VERSION" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on NPM registry"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published to NPM"
          fi

      # Trusted publishing (OIDC) — the same method npm-publish-manual.yml
      # uses (proven publishing 2.16.2, 2026-09-27). npm >= 11.5.1 is required;
      # setup-node's registry-url writes a ${NODE_AUTH_TOKEN} placeholder into
      # the job npmrc that would be tried FIRST and fail before the OIDC
      # exchange, so rewrite it bare. Do NOT set NODE_AUTH_TOKEN here — a
      # present-but-2FA-bound token shadows the OIDC path and fails the run.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPMRC"

      - name: Publish to NPM (if version doesn't exist)
        if: steps.check_npm.outputs.exists == 'false' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master')
        run: |
          echo "Publishing @miller-tech/uap@${{ steps.get_version.outputs.VERSION }} to NPM..."
          # prepublishOnly (build+test) already ran above in this job; the
          # droid-integrity and full suite run too, so --ignore-scripts skips
          # only that duplicate. --provenance requires the OIDC id-token flow.
          # OIDC env sanity (values are secrets — presence/absence only).
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo NO)"
          npm publish --access public --provenance --ignore-scripts

      # ENEEDAUTH is ambiguous: it appears both when npm never attempts the
      # OIDC exchange (missing id-token permission) and when the registry
      # rejects it (trusted-publisher entry bound to a different workflow
      # filename). The npm debug log records which; dump the auth-relevant
      # lines so the next fix targets the right layer.
      - name: Dump npm debug log on failure
        if: failure()
        run: |
          LOG=$(ls -t "$HOME/.npm/_logs/"*-debug-0.log 2>/dev/null | head -1)
          echo "npm debug log: $LOG"
          if [ -n "$LOG" ]; then
            grep -iE "oidc|token|auth|provenance|registry|publish" "$LOG" \
              | grep -viE "tarball|integrity|shasum" | tail -40
          fi

      - name: Output publication status
        if: always()
        run: |
          echo "### Publication Status" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @miller-tech/uap" >> $GITHUB_STEP_SUMMARY  
          echo "**Version:** v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_npm.outputs.exists }}" == "true" ]; then
            echo "**Status:** Already published (skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Published successfully to https://www.npmjs.com/package/@miller-tech/uap" >> $GITHUB_STEP_SUMMARY
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-test-npm-publish
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get package version
        id: get_version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT  
            echo "Creating tag for first release of version..."
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## @miller-tech/uap v${{ steps.get_version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/DammianMiller/universal-agent-protocol/blob/master/CHANGELOG.md) for details.

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
