name: Deploy Verify (dev → staging → prod)

# Real validation gates for the convergence loop's CI watcher (ci-watcher.ts):
# once `uap deliver --watch-ci` pushes a branch, this workflow builds, tests,
# then deploys + smoke-checks each environment. The CI watcher resolves this run
# by head SHA and reads job conclusions (deploy-dev / deploy-staging /
# deploy-prod) plus the deploy-status.json artifacts to decide green vs failed
# and feed failures back into convergence.
#
# Triggers on EVERY branch push so worktree-branch pushes from the watcher fire
# it. Deploy commands fall back to a no-op note when the repo exposes no
# deploy:<env>/smoke:<env> scripts, so the workflow is safe before deploy infra
# exists and becomes real automatically once those scripts are added.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

# One run per branch; cancel superseded runs so rapid watcher pushes don't stack.
concurrency:
  group: deploy-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python harness deps
        # The vitest suite spawns python3 harnesses (the placement gate, the
        # end-turn classifier) whose sliced proxy code imports fastapi/httpx
        # at import time. Without these, `npm run test:ci` fails 11 tests in
        # CI (ModuleNotFoundError: httpx) while passing everywhere httpx
        # happens to be installed — same set as the enforcers job.
        run: pip install fastapi uvicorn httpx openai
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npx --no-install tsc --noEmit
      - name: Test
        run: npm run test:ci

  # The runtime policy-enforcement plane is Python (.policy-tools enforcers +
  # the proxy). These security-critical tests gate self-protect, workdir-scope,
  # sandbox tool-strip, path containment, and proxy env handling — they must run
  # in CI or the whole enforcement layer can regress silently on a green PR.
  # Runs via `npm run test:enforcers`, an EXPLICIT module list — not discovery.
  #
  # That comment used to say two files were excluded as a known-red backlog. In
  # practice 37 of 51 modules were unlisted and 34 of them passed: the guardrail
  # suites (error-loop, deferral-break, stuck-break, session-admission,
  # cycle-break) had no CI coverage at all, which is how the same guards kept
  # regressing on green PRs. All 34 are now listed — 102 tests became 436.
  #
  # Two of the three remaining exclusions are now fixed and listed — 483 tests
  # became 770:
  #   - test_anthropic_proxy_streaming had 7 genuinely stale assertions (the
  #     max_tokens floors superseded by the thinking-floor, a grammar guard that
  #     postdated its test, the turn-count breaker's rewording, and two
  #     malformed-payload cases deliberately reversed by _strip_orphan_tool_xml).
  #     This is the module covering the streaming 503 retry, so its absence is
  #     what let that bug ship on a green PR.
  #   - test_delivery_enforcement_worktree never drifted at all. Its env helpers
  #     copied os.environ without stripping UAP_DELIVER_BYPASS / _LOCAL_MODE /
  #     ANTHROPIC_BASE_URL, so a local-session shell turned block into advisory
  #     and the block-expecting tests read 0 instead of 2. Hermetic now.
  #
  # One remains out:
  #   - test_uap_compliance                needs a populated DB; environment-bound
  # Fix that, then add it here too. (Its schema-only assertions could be made
  # CI-runnable with a tmpdir fixture; two of its cases accept both success and
  # failure and should be tightened first.)
  #
  # A module is only covered if it is BOTH listed here AND made of
  # unittest.TestCase subclasses — `python -m unittest` silently collects nothing
  # from a plain pytest-style class and still exits 0.
  enforcers:
    name: Policy Enforcers (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install proxy test deps
        # The proxy test modules import the proxy, which needs these at import
        # time — the job shipped without them and has been red since it landed.
        # (Full third-party set of anthropic_proxy.py + the test modules.)
        run: pip install fastapi uvicorn httpx openai
      - name: Run security enforcer + proxy tests
        run: npm run test:enforcers

  deploy-dev:
    name: deploy-dev
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy (dev)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['deploy:dev']?0:1)"; then
            npm run deploy:dev
          else
            echo "No deploy:dev script — verification no-op."
          fi
      - name: Smoke (dev)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['smoke:dev']||require('./package.json').scripts?.smoke?0:1)"; then
            npm run smoke:dev --if-present || npm run smoke
          else
            echo "No smoke/smoke:dev script — verification no-op."
          fi
      - name: Emit deploy status
        if: always()
        run: |
          mkdir -p deploy-status
          cat > deploy-status/dev.json <<EOF
          {"environment":"dev","status":"${{ job.status }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","sha":"${{ github.sha }}"}
          EOF
          echo "### deploy-dev: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-status-dev
          path: deploy-status/dev.json

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy (staging)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['deploy:staging']?0:1)"; then
            npm run deploy:staging
          else
            echo "No deploy:staging script — verification no-op."
          fi
      - name: Smoke (staging)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['smoke:staging']||require('./package.json').scripts?.smoke?0:1)"; then
            npm run smoke:staging --if-present || npm run smoke
          else
            echo "No smoke/smoke:staging script — verification no-op."
          fi
      - name: Emit deploy status
        if: always()
        run: |
          mkdir -p deploy-status
          cat > deploy-status/staging.json <<EOF
          {"environment":"staging","status":"${{ job.status }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","sha":"${{ github.sha }}"}
          EOF
          echo "### deploy-staging: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-status-staging
          path: deploy-status/staging.json

  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Production deploys only from the default branch; environment protection
    # rules (required reviewers) can gate this job in repo settings.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy (prod)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['deploy:prod']?0:1)"; then
            npm run deploy:prod
          else
            echo "No deploy:prod script — verification no-op."
          fi
      - name: Smoke (prod)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['smoke:prod']||require('./package.json').scripts?.smoke?0:1)"; then
            npm run smoke:prod --if-present || npm run smoke
          else
            echo "No smoke/smoke:prod script — verification no-op."
          fi
      - name: Emit deploy status
        if: always()
        run: |
          mkdir -p deploy-status
          cat > deploy-status/prod.json <<EOF
          {"environment":"prod","status":"${{ job.status }}","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","sha":"${{ github.sha }}"}
          EOF
          echo "### deploy-prod: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-status-prod
          path: deploy-status/prod.json

  # GitHub Release on master, moved here from deploy-publish.yml (deleted).
  # That workflow's npm-publish step failed ENEEDAUTH on EVERY master push
  # for a week (v2.19.x–v2.24.0): npm's OIDC trusted-publisher entry is bound
  # to the "NPM Publish - Manual Trigger" workflow only, so an auto-publish
  # from any other workflow can never authorize. ONE publish pipeline exists
  # now — npm-publish-manual.yml (proven: it published 2.16.2). This release
  # job is the non-publish part of the old workflow that was worth keeping:
  # tag + GitHub Release on the default branch, only after verify is green.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Get package version
        id: get_version
        run: echo "VERSION=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Creating tag for first release of version..."
          fi
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## @miller-tech/uap v${{ steps.get_version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/DammianMiller/universal-agent-protocol/blob/master/CHANGELOG.md) for details.

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
